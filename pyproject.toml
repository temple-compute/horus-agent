[project]
name = "horus_agent"
description = "Horus target for machines that only allow outbound connections: a small agent polls a broker for target operations and runs them locally."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
]
dependencies = ["horus-runtime>=0.8.4", "httpx>=0.28"]
dynamic = ["version"]

[project.scripts]
horus-agent = "horus_agent.cli:main"

# ================
# Plugin entry-points
# ================
[project.entry-points."horus.target"]
agent = "horus_agent.target"

# ================

[dependency-groups]
dev = [
  "licenseheaders~=0.8",
  "mypy~=1.19",
  "pre_commit~=4.0",
  "pytest~=9.0",
  "pytest-asyncio~=1.3.0",
  "pytest-cov~=7.0",
  "ruff~=0.15",
  "horus-slurm==0.6.2",
]

[build-system]
requires = ["hatchling>=1.29,<2.0", "uv-dynamic-versioning>=0.14.0,<1.0"]
build-backend = "hatchling.build"

[tool.coverage.run]
source = ["horus_agent"]

[tool.coverage.report]
omit = ["tests/*"]

# Other tool configurations
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/horus_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/horus_agent", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["build", "dist"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = """
    --verbose
    --cov=src/horus_agent
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=90
"""
minversion = "7.0"
python_classes = ["Test*"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 79
target-version = "py313"
exclude = [".git", ".venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
select = [
  "D",  # pydocstyle
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "N",  # pep8-naming
  "UP",  # pyupgrade
  "B",  # flake8-bugbear
  "PL",  # pylint
  "RUF",  # ruff-specific
  "ARG",  # ruff-arglint
  "SLF",  # ruff-slf
]
extend-select = ["T201"]  # Prevent use of print()

ignore = [
  "E203",  # Whitespace before ':', conflicts with formatter
  "D104",  # Missing docstring in __init__ (often redundant)
  "D205",  # 1 blank line required between summary line and description
  "D212",  # Multi-line docstring summary should start at the first line
  "D200",  # One-line docstring should fit on one line
  "PLR2004",  # Magic numbers are often more readable than constants for things like HTTP status codes
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["SLF001", "PLC0415", "ARG002", "D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.1"
