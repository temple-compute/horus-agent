name: Python CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install uv and sync dependencies
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Sync project dependencies
        run: uv sync --locked --group dev

      - name: Lint with Ruff
        run: uv run make lint

      - name: Check license headers
        run: |
          uv run make add-license-headers
          if ! git diff --quiet -- src tests; then
            echo "License headers are missing or incorrect. Please run 'make add-license-headers' to fix.";
            git diff --name-only -- src tests
            exit 1;
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install uv and sync dependencies
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Sync project dependencies
        run: uv sync --locked --group dev

      - name: Run tests with coverage
        run: uv run make test

      - name: Upload coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: matrix.python-version == '3.13'
        with:
          name: coverage-html-report
          path: htmlcov/
          retention-days: 5

  wheel:
    # The published package must import with the released horus-runtime,
    # whatever [tool.uv.sources] pins for development.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Build the wheel without dev sources
        run: uv build --wheel --no-sources -o dist

      - name: Import it with the oldest and newest released runtime
        run: |
          for runtime in "horus-runtime==0.8.4" "horus-runtime<0.10"; do
            rm -rf /tmp/venv
            uv venv -q -p 3.13 /tmp/venv
            VIRTUAL_ENV=/tmp/venv uv pip install --no-sources dist/*.whl "$runtime"
            /tmp/venv/bin/horus-agent --help > /dev/null
            /tmp/venv/bin/python -c "import horus_agent.target, horus_agent.ops"
          done
