name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the built files to the release
      id-token: write # PyPI trusted publishing

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # uv-dynamic-versioning reads the version from the tag

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Build package
        run: uv build

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
