# Tasks as another user with run_as_via = "setpriv" (/etc/horus-agent/policy.toml).
# The agent holds these capabilities and drops them for each task; whoever
# takes over the agent's process can become any user. Prefer run-as-sudo.conf.
[Service]
CapabilityBoundingSet=CAP_SETUID CAP_SETGID
AmbientCapabilities=CAP_SETUID CAP_SETGID
