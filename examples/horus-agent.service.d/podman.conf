# Rootless Podman tasks, together with run-as-sudo.conf or run-as-setpriv.conf.
# newuidmap needs these capabilities, and a container's own /proc cannot be
# mounted while these protections mask parts of the host's.
[Service]
NoNewPrivileges=no
CapabilityBoundingSet=CAP_SETUID CAP_SETGID CAP_DAC_OVERRIDE CAP_SYS_ADMIN
ProtectKernelTunables=no
ProtectKernelLogs=no
ProtectKernelModules=no
ProtectControlGroups=no
ProtectClock=no
ProtectHostname=no
